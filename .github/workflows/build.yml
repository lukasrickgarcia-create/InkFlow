name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Localizar o projeto
        run: |
          if [ -f InkFlow.zip ]; then
            unzip -q -o InkFlow.zip -d _src
            echo "PROJ=_src/InkFlow" >> "$GITHUB_ENV"
          elif [ -f InkFlow/gradlew ]; then
            echo "PROJ=InkFlow" >> "$GITHUB_ENV"
          else
            echo "PROJ=." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar o app
        working-directory: ${{ env.PROJ }}
        run: |
          echo "SDK: $ANDROID_HOME"
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/InkFlow.apk"

      - name: Guardar o erro no repositório (branch ci-log)
        if: failure()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          grep -E "^e: |error:|What went wrong|FAILURE|Caused by|> " build.log > erros.txt || true
          cp build.log /tmp/build.log; cp erros.txt /tmp/erros.txt
          git checkout --orphan ci-log
          git rm -rf . > /dev/null
          cp /tmp/build.log /tmp/erros.txt .
          git add build.log erros.txt
          git commit -m "log do build ${{ github.run_number }}"
          git push -f origin ci-log

      - name: Testes de lógica
        working-directory: ${{ env.PROJ }}
        continue-on-error: true
        run: ./gradlew testDebugUnitTest

      - name: Publicar o APK para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: InkFlow – build ${{ github.run_number }}
          body: Baixe o InkFlow.apk abaixo no tablet e instale.
          files: InkFlow.apk
